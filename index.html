<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f9a47" />
    <title>Round About</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Overpass:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="game.css" />
    <script type="module" src="/web/main.ts"></script>
  </head>
  <body>
    <div id="sessionEntry" class="session-entry" hidden></div>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-sign" viewBox="-50 -50 100 100" aria-hidden="true"><circle r="46" fill="#1F56B3" stroke="#F3F1E8" stroke-width="6" /><g fill="none" stroke="#F3F1E8" stroke-width="12"><path d="M 26 4.6 A 26.4 26.4 0 0 0 10.4 -24.3" /><path d="M 26 4.6 A 26.4 26.4 0 0 0 10.4 -24.3" transform="rotate(120)" /><path d="M 26 4.6 A 26.4 26.4 0 0 0 10.4 -24.3" transform="rotate(240)" /></g></svg>
          <span>Round About</span>
        </div>
        <div class="status"><span id="roundLabel" class="draw-label">Draw 1</span><span id="pileCount" class="pile-sign">12 cards to go</span></div>
        <button class="new-game" id="newGameButton" type="button" aria-label="New game">↻ <span>New game</span></button>
      </header>

      <main class="layout">
        <section class="board-area" aria-label="Roundabout">
          <div class="board" id="board">
            <svg class="road" id="road" aria-hidden="true"></svg>
            <div id="ringCards"></div>
            <div class="island" id="island"></div>
          </div>
        </section>

        <aside class="play-panel" aria-label="Current turn">
          <div class="panel-header"><span id="lifeText">Lives</span><div class="lives" id="lives" role="img" aria-label="3 of 3 lives left"></div></div>
          <div class="panel-body">
            <h1 id="turnHeading">Ready?</h1>
            <p id="turnDescription"></p>
            <div id="turnContent"></div>
          </div>
        </aside>
      </main>
    </div>
    <dialog id="confirmDialog"><form method="dialog"><h2>Start a new game?</h2><p>You get a fresh roundabout with a new invite link. The others can join it with one tap.</p><div class="dialog-actions"><button class="button light" value="cancel">Keep playing</button><button class="button primary" value="confirm">New game</button></div></form></dialog>
  </body>
</html>
